# Enable logging
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_RTT_CONSOLE=y

# Enable GPIO for LEDs
CONFIG_GPIO=y

# Enable Axon NPU driver and configure buffer.
# Size must be >= this model's MAX_IL_BUFFER_USED (175104), declared in
# nordic-axon-model/nrf_axon_model_finger_digits_v3_1_.h. If you swap models,
# update this to the new model's value.
CONFIG_NRF_AXON=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=175104

# Enable and configure Arducam dependencies
CONFIG_SPI=y
CONFIG_VIDEO=y
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=2200
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2

# Other
CONFIG_ASSERT=n
# run_classifier() puts a ~27 KB int8 input vector on the calling (main) stack,
# plus DSP/inference call frames. 1024 is far too small.
CONFIG_MAIN_STACK_SIZE=40960

# Edge Impulse SDK compiled from THIS export (see CMakeLists.txt). Keep =n so the
# export's SDK is used and the mismatched edge-impulse-sdk-zephyr module stays off.
CONFIG_EDGE_IMPULSE_SDK=n
CONFIG_CPP=y
CONFIG_STD_CPP11=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_FP16=n

# EI DSP is float-heavy and allocates the ~110 KB feature matrix on the heap.
# newlib gives malloc the remaining SRAM (~512 KB part, plenty); FPU for speed.
CONFIG_NEWLIB_LIBC=y
CONFIG_FPU=y

CONFIG_NRF_AXON_MODEL_NAME="finger_digits_v3_1"