# Enable logging
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_RTT_CONSOLE=y

# Enable GPIO for LEDs
CONFIG_GPIO=y

# Enable Axon NPU driver and configure buffer
CONFIG_NRF_AXON=y
CONFIG_NRF_AXON_INTERLAYER_BUFFER_SIZE=172033

# Enable and configure Arducam dependencies
CONFIG_SPI=y
CONFIG_VIDEO=y
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=2200
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2

# Other
CONFIG_ASSERT=n
CONFIG_MAIN_STACK_SIZE=2048

# --- Bluetooth LE + NUS ---
# TOGGLE: comment out this whole block (down to CONFIG_BT_MAX_CONN) to build
# without Bluetooth. Nothing else needs editing -- src/ble_nus.c is dropped
# from the build by CMakeLists.txt and the ble_nus_*() calls in main.c become
# no-op stubs (see src/ble_nus.h).
# Comment out the whole block, not just CONFIG_BT: the remaining lines would
# then be assignments to symbols with unmet dependencies, which Kconfig warns
# about and ignores.
#CONFIG_BT=y
#CONFIG_BT_PERIPHERAL=y
#CONFIG_BT_NUS=y
#CONFIG_BT_DEVICE_NAME="Axon_Sensor"   # whatever you want B to scan for
#CONFIG_BT_MAX_CONN=1

# BLE host runs work here; the sample's default main workqueue is too small
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# BLE host uses some kernel heap
CONFIG_HEAP_MEM_POOL_SIZE=2048