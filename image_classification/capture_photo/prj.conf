# Enable logging
CONFIG_PRINTK=y
CONFIG_LOG=y
#CONFIG_LOG_MODE_IMMEDIATE=y
#CONFIG_CBPRINTF_FP_SUPPORT=y

# Enable GPIO for LEDs
CONFIG_GPIO=y

# Enable and configure Arducam dependencies
CONFIG_SPI=y
CONFIG_VIDEO=y
CONFIG_VIDEO_BUFFER_POOL_HEAP_SIZE=2200
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4

# Other
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=2048

#enable SEGGER RTT to tranfer captured JPEGs to the host
CONFIG_USE_SEGGER_RTT=y

#keep log output on UART
CONFIG_LOG_BACKEND_RTT=n 


