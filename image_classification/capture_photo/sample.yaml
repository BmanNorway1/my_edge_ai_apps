sample:
  description: Capture Photo application
  name: capture_photo

common:
  sysbuild: true
  build_only: true
  tags:
    - ci_build
    - sysbuild
    - ci_applications_capture_photo
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "Idle: sw0"
      - "Captured JPEG|Stream mode"

tests:
  applications.capture_photo.zdebug:
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
